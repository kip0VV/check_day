name: Daily Activity

on:
  schedule:
    # Понедельник–пятница, 09:00 UTC
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "- $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.md

      - name: Commit and push
        run: |
          git config user.name "kip0VV"
          git config user.email "324505538+kip0VV@users.noreply.github.com"

          git add activity.md
          git commit -m "chore: daily activity"
          git push
